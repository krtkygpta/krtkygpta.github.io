<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartikey Gupta - Portfolio</title>
    <style>
        @font-face {
            font-family: 'Ndot57';
            src: url('https://cdn.shopify.com/s/files/1/0584/0932/0622/t/1/assets/fonts-ndot57.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica', Arial, sans-serif;
            background-color: #000;
            color: white;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .container {
            position: relative;
            min-height: 100vh;
        }

        /* Moving Blob */
        #blob {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background-color: #ef4444;
            opacity: 0.4;
            filter: blur(150px);
            pointer-events: none;
            z-index: 0;
            transition: all 0.3s ease-out;
        }

        /* Hero Section */
        .hero {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .hero h2 {
            font-size: 1.5rem;
            height: 60px;
        }

        .typewriter {
            border-right: 2px solid white;
            animation: cursor-blink 1s infinite;
        }

        @keyframes cursor-blink {
            0%, 50% { border-color: white; }
            51%, 100% { border-color: transparent; }
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            padding-bottom: 40px;
        }

        .nav-links a {
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #f87171;
        }

        /* Sections */
        .section {
            position: relative;
            z-index: 10;
            padding: 80px 40px;
        }

        .section h2 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .about-text {
            max-width: 512px;
            color: #d1d5db;
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            margin-top: 40px;
        }

        @media (min-width: 768px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .projects-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .project-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 24px;
            display: block;
            color: white;
            text-decoration: none;
            transition: transform 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .project-card:hover {
            transform: scale(1.05);
        }

        .project-card h3 {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .project-description {
            font-size: 0.875rem;
            color: #9ca3af;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .project-card:hover .project-description {
            max-height: 128px;
        }

        /* Contact Links */
        .contact-links {
            display: flex;
            gap: 24px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .contact-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-links a:hover {
            color: #f87171;
        }

        .loading {
            color: #9ca3af;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .hero h2 {
                font-size: 1.25rem;
            }
            
            .hero, .section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Moving Blob -->
        <div id="blob"></div>

        <!-- Hero Section -->
        <section class="hero">
            <div>
                <h1>Kartikey Gupta</h1>
                <h2 id="typewriter-text" class="typewriter" style="font-family: 'Ndot57', sans-serif;"></h2>
            </div>

            <div class="nav-links">
                <a href="#about">About Me</a>
                <a href="#projects">Projects</a>
                <a href="#achievements">Achievements</a>
                <a href="#contact">Contact</a>
            </div>
        </section>

        <!-- About Me -->
        <section id="about" class="section">
            <h2>About Me</h2>
            <p class="about-text">
                I am a student and programmer who loves working on AI and full-stack projects.
            </p>
        </section>

        <!-- Projects -->
        <section id="projects" class="section">
            <h2>Projects</h2>
            <div id="projects-container" class="projects-grid">
                <div class="loading">Loading projects...</div>
            </div>
        </section>

        <!-- Achievements -->
        <section id="achievements" class="section">
            <h2>Achievements</h2>
            <p style="color: #9ca3af;">Coming soon...</p>
        </section>

        <!-- Contact -->
        <section id="contact" class="section">
            <h2>Contact</h2>
            <p>Email: krtkygpta@gmail.com</p>
            <div class="contact-links">
                <a href="https://github.com/krtkygpta" target="_blank" rel="noopener noreferrer">GitHub</a>
                <!-- <a href="https://linkedin.com/in/krtkygpta" target="_blank" rel="noopener noreferrer">LinkedIn</a> -->
                <a href="https://www.instagram.com/krtkygpta/#" target="_blank" rel="noopener noreferrer">Instagram</a>
            </div>
        </section>
    </div>

    <script>
        // Typewriter Effect
        class Typewriter {
            constructor(element, words, options = {}) {
                this.element = element;
                this.words = words;
                this.typeSpeed = options.typeSpeed || 70;
                this.deleteSpeed = options.deleteSpeed || 50;
                this.delaySpeed = options.delaySpeed || 1500;
                this.currentWordIndex = 0;
                this.currentText = '';
                this.isDeleting = false;
                this.start();
            }

            start() {
                this.type();
            }

            type() {
                const currentWord = this.words[this.currentWordIndex];
                
                if (this.isDeleting) {
                    this.currentText = currentWord.substring(0, this.currentText.length - 1);
                } else {
                    this.currentText = currentWord.substring(0, this.currentText.length + 1);
                }

                this.element.textContent = this.currentText;

                let typeSpeed = this.isDeleting ? this.deleteSpeed : this.typeSpeed;

                if (!this.isDeleting && this.currentText === currentWord) {
                    typeSpeed = this.delaySpeed;
                    this.isDeleting = true;
                } else if (this.isDeleting && this.currentText === '') {
                    this.isDeleting = false;
                    this.currentWordIndex = (this.currentWordIndex + 1) % this.words.length;
                    typeSpeed = 500;
                }

                setTimeout(() => this.type(), typeSpeed);
            }
        }

        // Moving Blob
        const blob = document.getElementById('blob');
        let mouseX = 0, mouseY = 0;
        let blobX = 0, blobY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateBlob() {
            blobX += (mouseX - blobX - 250) * 0.1;
            blobY += (mouseY - blobY - 250) * 0.1;
            
            blob.style.transform = `translate(${blobX}px, ${blobY}px)`;
            requestAnimationFrame(animateBlob);
        }

        // Fetch GitHub Projects
        async function loadProjects() {
            try {
                const response = await fetch('https://api.github.com/users/krtkygpta/repos');
                const projects = await response.json();
                
                const projectsContainer = document.getElementById('projects-container');
                projectsContainer.innerHTML = '';

                projects.forEach(repo => {
                    const projectCard = document.createElement('a');
                    projectCard.className = 'project-card';
                    projectCard.href = repo.html_url;
                    projectCard.target = '_blank';
                    projectCard.rel = 'noopener noreferrer';
                    
                    projectCard.innerHTML = `
                        <h3>${repo.name}</h3>
                        <p class="project-description">
                            ${repo.description || 'No description available.'}
                        </p>
                    `;
                    
                    projectsContainer.appendChild(projectCard);
                });
            } catch (error) {
                console.error('Failed to load projects:', error);
                document.getElementById('projects-container').innerHTML = 
                    '<div style="color: #9ca3af;">Failed to load projects. Please try again later.</div>';
            }
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Start typewriter
            new Typewriter(
                document.getElementById('typewriter-text'),
                ['Student', 'Programmer', 'AI Enthusiast'],
                {
                    typeSpeed: 70,
                    deleteSpeed: 50,
                    delaySpeed: 1500
                }
            );

            // Start blob animation
            animateBlob();

            // Load projects
            loadProjects();
        });
    </script>
</body>
</html>
